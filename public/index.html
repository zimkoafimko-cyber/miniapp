<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelCrypto Hub</title>
    <!-- Подключаем шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Подключаем стили с защитой от кэша -->
    <link rel="stylesheet" href="styles.css?v=3.0">
</head>
<body>

    <div class="app-container">

        <!-- Шапка профиля и баланс -->
        <div class="header-card">
            <div class="balance-info">
                <h2>Ваш баланс</h2>
                <div class="balance-amount">
                    <span id="balance">0</span> <span class="star-icon">⭐</span>
                </div>
            </div>
            <div class="user-profile-badge">
                <div class="user-avatar">U</div>
                <div class="user-name">Игрок</div>
            </div>
        </div>

        <!-- Главная вкладка (Главная) -->
        <div id="home" class="tab-content active">
            <div class="screen-title-box">
                <h2>Главная панель</h2>
                <p>Зарабатывайте звезды и управляйте балансом</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon gold-glow">⚡</div>
                    <div class="stat-info">
                        <span class="stat-value" id="multiplier-val">1x</span>
                        <span class="stat-label">Множитель</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <span class="stat-value">0</span>
                        <span class="stat-label">Рефералы</span>
                    </div>
                </div>
            </div>

            <!-- Главная кнопка для кликов/заработка -->
            <button class="btn-primary btn-gold" id="click-btn">🌟 Получить звезду (+1)</button>

            <!-- Ссылка на вход в админку -->
            <div style="text-align: center; margin-top: 8px;">
                <a href="/admin.html" style="color: #cbd5e1; font-size: 12px; font-weight: 600; text-decoration: none; background: rgba(255,255,255,0.08); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                    🔐 Войти в админ-панель
                </a>
            </div>
        </div>

        <!-- Вкладка Кошелек / Вывод -->
        <div id="wallet" class="tab-content">
            <div class="screen-title-box">
                <h2>Кошелек</h2>
                <p>Вывод доступен на ваш аккаунт</p>
            </div>
            <div class="wallet-main-card">
                <div class="wallet-balance-title">Доступно к выводу</div>
                <div class="wallet-balance-val"><span id="balance">0</span> ⭐</div>
                <div class="wallet-limit-info">Минимум для вывода: 50 ⭐</div>
            </div>
            <button class="btn-primary btn-success">Вывести звезды</button>
        </div>

        <!-- Вкладка Игры -->
        <div id="games" class="tab-content">
            <div class="screen-title-box">
                <h2>Игровая зона</h2>
                <p>Испытайте удачу</p>
            </div>
            <div class="game-card">
                <div class="crash-screen">
                    <div class="crash-multiplier">1.00x</div>
                </div>
                <button class="btn-primary" style="margin-top: 8px;">Сыграть в Crash</button>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <nav class="nav-bar">
            <button class="nav-item active" data-tab="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Главная</span>
            </button>
            <button class="nav-item" data-tab="wallet">
                <span class="nav-icon">👛</span>
                <span class="nav-label">Кошелек</span>
            </button>
            <button class="nav-item" data-tab="games">
                <span class="nav-icon">🎮</span>
                <span class="nav-label">Игры</span>
            </button>
        </nav>

    </div>

    <!-- Подключаем логику приложения -->
    <script src="app.js"></script>
</body>
</html>
