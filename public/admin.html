<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 35%, #ec4899 70%, #3b82f6 100%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        .card {
            background: rgba(20, 24, 40, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h2 { margin-bottom: 14px; font-size: 18px; text-align: center; }
        h3 { font-size: 14px; margin-top: 15px; margin-bottom: 8px; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #0b0f19;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        button:active { transform: scale(0.98); }
        .hidden { display: none; }
        .error { color: #ef4444; font-size: 12px; text-align: center; margin-bottom: 8px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
        .back-link { display: block; text-align: center; margin-top: 12px; color: #94a3b8; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

    <div id="login-container" class="card">
        <h2>🔒 Вход в админку</h2>
        <div id="error-msg" class="error"></div>
        <input type="text" id="username" placeholder="Логин (alina)">
        <input type="password" id="admin-password" placeholder="Пароль (opelve)">
        <button onclick="login()">Войти</button>
        <a href="/" class="back-link">← Вернуться в приложение</a>
    </div>

    <div id="admin-panel" class="card hidden">
        <h2>⚡ Управление балансом</h2>
        <input type="text" id="target-user" placeholder="ID игрока (например, ваш ID)">
        <input type="number" id="target-amount" placeholder="Количество звезд">
        <button onclick="setBalance()" style="margin-bottom: 14px;">Выдать баланс</button>
        
        <h3>Игроки в памяти устройства:</h3>
        <div id="users-list" style="margin-top: 8px; max-height: 140px; overflow-y: auto;"></div>
        <button onclick="logout()" style="background: #ef4444; margin-top: 14px;">Выйти</button>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('admin-password').value;
            
            // Простейшая проверка логина/пароля прямо в клиенте
            if (username === 'alina' && password === 'opelve') {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadUsers();
            } else {
                document.getElementById('error-msg').innerText = 'Неверный логин или пароль!';
            }
        }

        function setBalance() {
            const userId = document.getElementById('target-user').value.trim();
            const amount = Number(document.getElementById('target-amount').value);
            
            if (!userId || isNaN(amount)) {
                alert('Заполните корректно ID игрока и сумму!');
                return;
            }

            // Записываем баланс напрямую в localStorage по новому ключу v2
            const balanceKey = 'user_balance_v2_' + userId;
            localStorage.setItem(balanceKey, amount);
            
            alert(`✅ Успешно! Игроку ${userId} выдано ${amount} ⭐`);
            loadUsers();
        }

        function loadUsers() {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            
            let found = false;
            // Ищем все сохраненные балансы пользователей с версией v2 в localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('user_balance_v2_')) {
                    const userId = key.replace('user_balance_v2_', '');
                    const amount = localStorage.getItem(key);
                    list.innerHTML += `<div class="user-row"><span>ID: ${userId}</span> <b>${amount} ⭐</b></div>`;
                    found = true;
                }
            }

            if (!found) {
                list.innerHTML = '<div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 10px;">Пока нет активных игроков в памяти.</div>';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
