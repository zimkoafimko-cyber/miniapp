<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 35%, #ec4899 70%, #3b82f6 100%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(20, 24, 40, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 16px; font-size: 20px; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #0b0f19;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        button:active { transform: scale(0.98); }
        .hidden { display: none; }
        .error { color: #ef4444; font-size: 12px; text-align: center; margin-bottom: 10px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- ФОРМА ВХОДА -->
    <div id="login-container" class="card">
        <h2>🔒 Вход в админку</h2>
        <div id="error-msg" class="error"></div>
        <input type="text" id="username" placeholder="Логин (admin)">
        <input type="password" id="admin-password" placeholder="Пароль (12345)">
        <button onclick="login()">Войти</button>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ (скрыта до входа) -->
    <div id="admin-panel" class="card hidden">
        <h2>⚡ Управление балансом</h2>
        <input type="text" id="target-user" placeholder="ID или Юзернейм игрока">
        <input type="number" id="target-amount" placeholder="Сумма звезд">
        <button onclick="setBalance()" style="margin-bottom: 16px;">Выдать / Изменить баланс</button>
        
        <h3>Список выданных балансов:</h3>
        <div id="users-list" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
        <button onclick="logout()" style="background: #ef4444; margin-top: 16px;">Выйти</button>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('admin-password').value;
            
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadUsers();
            } else {
                document.getElementById('error-msg').innerText = data.message;
            }
        }

        async function setBalance() {
            const userId = document.getElementById('target-user').value;
            const amount = document.getElementById('target-amount').value;
            
            if (!userId || !amount) return alert('Заполните все поля!');

            const res = await fetch('/api/admin/set-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount })
            });
            const data = await res.json();
            if (data.success) {
                alert('Баланс успешно обновлен!');
                renderUsers(data.balances);
            }
        }

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if (data.success) {
                renderUsers(data.balances);
            }
        }

        function renderUsers(balances) {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            for (const [id, amount] of Object.entries(balances)) {
                list.innerHTML += `<div class="user-row"><span>ID: ${id}</span> <b>${amount} ⭐</b></div>`;
            }
        }

        async function logout() {
            await fetch('/api/admin/logout');
            location.reload();
        }
    </script>
</body>
</html>
